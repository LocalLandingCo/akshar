# Generated by `npm run cms:generate` from site.config.ts — do not hand-edit.
# Reference: https://pagescms.org/docs/configuration
media:
  input: public/images
  output: /images
content:
  - name: posts-essays
    label: Essays
    type: collection
    path: content/posts/essays
    filename: '{title}.md'
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: slug
        label: Slug
        type: string
        description: Overrides the URL. Leave blank to derive it from the title.
      - name: tags
        label: Tags
        type: string
        list: true
      - name: excerpt
        label: Excerpt
        type: text
        description: Shown in listings. Leave blank to derive one from the body.
      - name: cover
        label: Cover image
        type: image
      - name: coverAlt
        label: Cover alt text
        type: string
        description: Required if a cover image is set.
      - name: draft
        label: Draft
        type: boolean
        description: Keeps this post off the live site until it's unchecked.
      - name: description
        label: SEO description
        type: text
        description: Overrides the excerpt for search engines and share previews.
      - name: body
        label: Body
        type: rich-text
        required: true
  - name: posts-poems
    label: Poems
    type: collection
    path: content/posts/poems
    filename: '{title}.md'
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: slug
        label: Slug
        type: string
        description: Overrides the URL. Leave blank to derive it from the title.
      - name: tags
        label: Tags
        type: string
        list: true
      - name: excerpt
        label: Excerpt
        type: text
        description: Shown in listings. Leave blank to derive one from the body.
      - name: cover
        label: Cover image
        type: image
      - name: coverAlt
        label: Cover alt text
        type: string
        description: Required if a cover image is set.
      - name: draft
        label: Draft
        type: boolean
        description: Keeps this post off the live site until it's unchecked.
      - name: description
        label: SEO description
        type: text
        description: Overrides the excerpt for search engines and share previews.
      - name: body
        label: Body
        type: rich-text
        required: true
  - name: pages
    label: Pages
    type: collection
    path: content/pages
    filename: '{title}.md'
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
      - name: description
        label: SEO description
        type: text
      - name: body
        label: Body
        type: rich-text
        required: true
