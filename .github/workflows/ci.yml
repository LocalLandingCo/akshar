name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # ADR-11 layer 2: assertions on the actual generated artifact —
      # canonical URLs, OG tags, drafts absent, weight budgets, sitemap/RSS
      # well-formed and correct, no internal link 404s.
      - name: Build-output assertions
        run: npx vitest run --config vitest.build.config.ts

      # ADR-11 layer 3: the ≥95 performance/accessibility/best-practices/SEO
      # budgets in spec.md §11, enforced rather than aspirational.
      - name: Lighthouse CI
        run: npm run lhci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
