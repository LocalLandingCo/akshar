# Generated by `npm run cms:generate` from site.config.ts — do not hand-edit.
# Read by Sveltia CMS (public/admin/index.html) and by `npx decap-server` for local editing.
# NOTE: site.config.ts has no `repository` set — the "OWNER/REPO" backend below
# needs a real value before the hosted (non-local) editor will work.
backend:
  name: github
  repo: OWNER/REPO
  branch: main
local_backend: true
media_folder: public/images
public_folder: /images
collections:
  - name: posts-essays
    label: Essays
    folder: content/posts/essays
    create: true
    delete: true
    slug: '{{title}}'
    extension: md
    format: frontmatter
    fields:
      - name: title
        label: Title
        widget: string
        required: true
      - name: date
        label: Date
        widget: datetime
        required: true
        time_format: false
      - name: slug
        label: Slug
        widget: string
        required: false
        hint: Overrides the URL. Leave blank to derive it from the title.
      - name: tags
        label: Tags
        widget: list
        required: false
        field:
          name: tag
          label: Tag
          widget: string
      - name: excerpt
        label: Excerpt
        widget: text
        required: false
        hint: Shown in listings. Leave blank to derive one from the body.
      - name: cover
        label: Cover image
        widget: image
        required: false
      - name: coverAlt
        label: Cover alt text
        widget: string
        required: false
        hint: Required if a cover image is set.
      - name: draft
        label: Draft
        widget: boolean
        required: false
        hint: Keeps this post off the live site until it's unchecked.
      - name: description
        label: SEO description
        widget: text
        required: false
        hint: Overrides the excerpt for search engines and share previews.
  - name: posts-poems
    label: Poems
    folder: content/posts/poems
    create: true
    delete: true
    slug: '{{title}}'
    extension: md
    format: frontmatter
    fields:
      - name: title
        label: Title
        widget: string
        required: true
      - name: date
        label: Date
        widget: datetime
        required: true
        time_format: false
      - name: slug
        label: Slug
        widget: string
        required: false
        hint: Overrides the URL. Leave blank to derive it from the title.
      - name: tags
        label: Tags
        widget: list
        required: false
        field:
          name: tag
          label: Tag
          widget: string
      - name: excerpt
        label: Excerpt
        widget: text
        required: false
        hint: Shown in listings. Leave blank to derive one from the body.
      - name: cover
        label: Cover image
        widget: image
        required: false
      - name: coverAlt
        label: Cover alt text
        widget: string
        required: false
        hint: Required if a cover image is set.
      - name: draft
        label: Draft
        widget: boolean
        required: false
        hint: Keeps this post off the live site until it's unchecked.
      - name: description
        label: SEO description
        widget: text
        required: false
        hint: Overrides the excerpt for search engines and share previews.
  - name: pages
    label: Pages
    folder: content/pages
    create: true
    delete: true
    slug: '{{title}}'
    extension: md
    format: frontmatter
    fields:
      - name: title
        label: Title
        widget: string
        required: true
      - name: slug
        label: Slug
        widget: string
        required: false
      - name: description
        label: SEO description
        widget: text
        required: false
